title = "HIGH FREQUENCY"
description = "Archivo y difusión de techno, trance, eurodance y hard-house de finales de los 90 y los 2000. Ediciones originales, promos y rarezas, restauradas."
default_language = "es"
base_url = "https://high-freq.pages.dev"   # ← tu dominio de Pages real

output_dir = "public"
minify_html = true

# Feeds (RSS con template feed.xml)
generate_feeds = true
feed_filenames = ["feed.xml"]
feed_limit = 100

[extra]
tagline = "dance music · archivo · difusión"
speeds = ["0.88", "1", "1.10", "1.15", "1.19", "1.28", "1.55", "1.82", "2.18", "2.81"]

# Comentarios (giscus). Descomenta y rellena si quieres habilitarlos:
# giscus = { repo = "tu-usuario/repo", repo_id = "R_kgDO...", category = "Comentarios", category_id = "DIC_kwDO..." }

links = [
  { label = "Bandcamp",    url = "https://bandcamp.com/tu-usuario",        desc = "tienda / extras" },
  { label = "archive.org", url = "https://archive.org/details/tu-archivo", desc = "espejo de audio" },
  { label = "Discord",     url = "https://discord.gg/tu-servidor",         desc = "comunidad" },
]
